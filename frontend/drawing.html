<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MetricCAD · Zeichnung</title><link rel="stylesheet" href="/drawing.css"><link rel="stylesheet" href="/project_sync.css"><style id="paperSize"></style></head><body>
<header class="cad-header"><strong>◈ MetricCAD</strong><button class="workspace-switch" popovertarget="workspace-menu">Zeichnung ▾</button>
<div id="workspace-menu" class="cad-menu" popover></div>
<div class="commands"><button id="new">Neu</button><button id="open">Öffnen</button><button id="save">Speichern</button><button popovertarget="file-menu">Datei ▾</button></div>
<div id="file-menu" class="cad-menu" popover><button id="saveAs">Speichern unter …</button></div>
<div class="commands"><button id="undo" title="Rückgängig" aria-label="Rückgängig">↶</button><button id="redo" title="Wiederholen" aria-label="Wiederholen">↷</button></div></header>
<nav id="ribbon" aria-label="Zeichnungswerkzeuge">
<div class="tool-group" role="group" aria-label="Modell"><div><button id="source" title="Teil öffnen" aria-label="Teil öffnen"><svg viewBox="0 0 28 28" aria-hidden="true"><path d="M2 6V4h8l3 3h10v4M2 6v16h12M14 14l6-3 6 3-6 3z M14 14v7l6 3 6-3v-7m-6 3v7"/></svg></button><button id="assemblySource" title="Baugruppe öffnen" aria-label="Baugruppe öffnen"><svg viewBox="0 0 28 28" aria-hidden="true"><path d="M2 6V4h8l3 3h10v4M2 6v16h12M9 13l5-3 5 3-5 3z M9 13v6l5 3v-6 M14 14l6-3 6 3-6 3z M14 14v7l6 3 6-3v-7m-6 3v7"/></svg></button><button id="update" title="Modellstand aktualisieren" aria-label="Modellstand aktualisieren"><svg viewBox="0 0 28 28" aria-hidden="true"><path d="M24 10a10 10 0 0 0-18-3L3 11m0-7v7h7 M4 17a10 10 0 0 0 18 3l3-5m0 7v-7h-7"/></svg></button></div><span>Modell</span></div>
<div class="tool-group" role="group" aria-label="Zeichnungsblatt"><div><button id="create" title="Zeichnungsblatt erstellen" aria-label="Zeichnungsblatt erstellen"><svg viewBox="0 0 28 28" aria-hidden="true"><path d="M5 25V2h13l5 6v8M17 2v7h6M5 25h11m6-7v9m-5-4h10"/></svg></button><button id="pageSettings" title="Blatteigenschaften" aria-label="Blatteigenschaften"><svg viewBox="0 0 28 28" aria-hidden="true"><path d="M3 3h22v22H3z M6 6h16v16H6z"/></svg></button></div><span>Zeichnungsblatt</span></div>
<div class="tool-group" role="group" aria-label="Ansichten"><div><button id="front" title="Vorderansicht" aria-label="Vorderansicht"><svg viewBox="0 0 28 28" aria-hidden="true"><path d="M3 3h22v22H3z M14 3v22"/></svg></button><button id="top" title="Draufsicht" aria-label="Draufsicht"><svg viewBox="0 0 28 28" aria-hidden="true"><path d="M2 6h24v16H2z M4 14h4m2 0h4m2 0h4m2 0h2"/></svg></button><button id="right" title="Rechtsansicht" aria-label="Rechtsansicht"><svg viewBox="0 0 28 28" aria-hidden="true"><path d="M6 3h6v16h12v6H6z"/></svg></button><button id="iso" title="Isometrische Ansicht" aria-label="Isometrische Ansicht"><svg viewBox="0 0 28 28" aria-hidden="true"><path d="M3 8l11-6 11 6-11 6z M3 8v12l11 6 11-6V8 M14 14v12"/></svg></button></div><span>Ansichten</span></div>
<div class="tool-group" role="group" aria-label="Bemaßung"><div><button id="autoDim" title="Automatisch bemaßen" aria-label="Automatisch bemaßen"><svg viewBox="0 0 28 28" aria-hidden="true"><path d="M2 9v15m24-15v15M3 18h22m-17-3-5 3 5 3m12-6 5 3-5 3M11 12l3-8 3 8m-5-3h4"/></svg></button><button id="horizontal" title="Horizontaler Abstand" aria-label="Horizontaler Abstand"><svg viewBox="0 0 28 28" aria-hidden="true"><path d="M2 7v14m24-14v14M3 14h22m-17-3-5 3 5 3m12-6 5 3-5 3"/></svg></button><button id="vertical" title="Vertikaler Abstand" aria-label="Vertikaler Abstand"><svg viewBox="0 0 28 28" aria-hidden="true"><path d="M7 2h14M7 26h14M14 3v22m-3-17 3-5 3 5m-6 12 3 5 3-5"/></svg></button><button id="length" title="Kantenlänge" aria-label="Kantenlänge"><svg viewBox="0 0 28 28" aria-hidden="true"><path d="M2 16l5 11M21 1l5 11M5 21 24 6m-15 9-4 6 7-2m5-11 7-2-3 6"/></svg></button><button id="radius" title="Radius" aria-label="Radius"><svg viewBox="0 0 28 28" aria-hidden="true"><path d="M3 22a16 16 0 0 1 16-16M5 20l15-12m-5 1 5-1-2 5"/></svg></button><button id="diameter" title="Durchmesser" aria-label="Durchmesser"><svg viewBox="0 0 28 28" aria-hidden="true"><path d="M23 14a9 9 0 1 1-18 0 9 9 0 1 1 18 0z M3 25 25 3"/></svg></button></div><span>Bemaßung</span></div>
<div class="tool-group" role="group" aria-label="Ausgabe"><div><button id="print" title="Blatt drucken" aria-label="Blatt drucken"><svg viewBox="0 0 28 28" aria-hidden="true"><path d="M7 10V2h14v8M7 20H3V10h22v10h-4M7 17h14v9H7z M20 13h2"/></svg></button><button id="pdf" title="Als PDF speichern (Druckdialog)" aria-label="Als PDF speichern (Druckdialog)"><svg viewBox="0 0 28 28" aria-hidden="true"><path d="M5 2h12l6 6v18H5z M17 2v7h6"/><text x="7" y="21" font-size="7" fill="currentColor" stroke="none">PDF</text></svg></button></div><span>Ausgabe</span></div>
</nav>
<main><aside><h2>Modellbaum</h2><div id="tree"></div></aside><section id="stage"><canvas id="modelView" hidden aria-label="Drehbare 3D-Modellansicht"></canvas><div id="preview"></div></section>
<aside><h2>Blatteigenschaften</h2><div id="projectionPanel" hidden><h3>Hauptansicht</h3><p id="projectionFace"></p><button id="turnProjection">Um 90° drehen</button> <button id="resetProjection">Standardansicht</button><p>Ziehen zum Drehen, Mausrad zum Zoomen. Eine ebene Fläche anklicken und das Zeichnungsblatt erstellen.</p></div><div id="settings" hidden>
<label>Blattname<input id="sheetTitle" type="text" style="display:block;width:100%;margin-top:4px;padding:6px;background:#233448;color:inherit;border:1px solid #3d5368;border-radius:5px;font:inherit"></label>
<label>Format<select id="format"><option>A4</option><option>A3</option></select></label>
<fieldset><legend>Ausrichtung</legend><div class="orientation"><button id="landscape" title="Querformat" aria-label="Querformat"><svg viewBox="0 0 28 28" aria-hidden="true"><path d="M2 6h24v16H2z"/></svg></button><button id="portrait" title="Hochformat" aria-label="Hochformat"><svg viewBox="0 0 28 28" aria-hidden="true"><path d="M6 2h16v24H6z"/></svg></button></div></fieldset><label>Maßstab<select id="scale"><option value="0">Automatisch einpassen</option></select></label>
<fieldset><legend>Ansichtsoptionen</legend><label><input type="checkbox" id="hiddenEdges">Verdeckte Kanten darstellen</label><label><input type="checkbox" id="centers">Mittellinien darstellen</label><label><input type="checkbox" id="dimensions">Bemaßungen anzeigen</label></fieldset>
<p id="hint"></p></div><form id="toleranceEditor" hidden>
<fieldset><legend>Maßeigenschaften</legend>
<label>Toleranz<select id="tolMode"><option value="none">Keine</option><option value="symmetric">Symmetrisch (±)</option><option value="limits">Oberes und unteres Abmaß</option></select></label>
<label id="tolUpperRow"><span id="tolUpperLabel"></span><input id="tolUpper" type="text" inputmode="decimal"></label>
<label id="tolLowerRow">Unteres Abmaß (mm)<input id="tolLower" type="text" inputmode="decimal"></label>
<button type="submit">Toleranz übernehmen</button></fieldset></form>
<button id="deleteDim" hidden>Maß löschen</button></aside></main><footer id="status" role="status"></footer>
<script src="/editor.js"></script><script src="/drawing.js"></script></body></html>
