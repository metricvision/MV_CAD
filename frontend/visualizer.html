<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MetricCAD · Visualisierung</title><link rel="stylesheet" href="/drawing.css"><link rel="stylesheet" href="/project_sync.css"><style>
#stage{padding:10px;display:grid;place-items:center;container-type:size;overflow:hidden}
#frame{width:min(100cqw,177.7778cqh);aspect-ratio:16/9;position:relative;background:#111822;border:1px solid #374956}
canvas,#frame img{display:block;width:100%;height:100%;touch-action:none}canvas{cursor:grab}canvas:active{cursor:grabbing}
#empty{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;color:#adc1cf}
aside input,aside select{display:block;width:100%;padding:5px;background:#101c28;color:inherit;border:1px solid #35485d;border-radius:4px}
aside input[type=color]{height:32px}.coords{display:flex;gap:5px}.coords label{flex:1;min-width:0}
#tree summary{margin:8px 0}dialog{max-width:90vw;background:#152130;color:inherit;border:1px solid #35485d}#imageViewport{width:min(82vw,128vh);aspect-ratio:16/9;overflow:hidden;position:relative;margin-bottom:10px;background:#101820;touch-action:none;cursor:grab}
#imageViewport:active{cursor:grabbing}#image{display:block;width:100%;height:100%;transform-origin:0 0;user-select:none;pointer-events:none}
#renderProgress{width:9em;accent-color:#25ac9c}#imageScale{margin:0 .6em;font-variant-numeric:tabular-nums}dialog a{color:#80ddd1;margin-right:1em}
</style></head><body>
<header class="cad-header"><strong>◈ MetricCAD</strong><button class="workspace-switch" popovertarget="workspace-menu">Visualisierung ▾</button>
<div id="workspace-menu" class="cad-menu" popover></div>
<div class="commands"><button id="save">Projekt speichern</button><button popovertarget="file-menu">Datei ▾</button></div>
<div id="file-menu" class="cad-menu" popover><button id="new">Neues Projekt</button><button id="open">Projekt öffnen …</button><button id="saveAs">Speichern unter …</button></div>
</header>
<nav id="ribbon" aria-label="Visualisierungswerkzeuge">
<div class="tool-group"><div><button id="source" title="Baugruppe laden" aria-label="Baugruppe laden"><svg viewBox="0 0 28 28" aria-hidden="true"><path d="M2 8h9l3 3h12l-4 12H3z M3 8V5h8l3 3h9v3"/></svg></button><button id="refresh" title="Baugruppe aktualisieren" aria-label="Baugruppe aktualisieren"><svg viewBox="0 0 28 28" aria-hidden="true"><path d="M23 11a9 9 0 1 0 0 8 M23 4v7h-7"/></svg></button></div><span>Modell</span></div>
<div class="tool-group"><div><button id="paint" title="Teilmaterial bearbeiten" aria-label="Teilmaterial bearbeiten"><svg viewBox="0 0 28 28" aria-hidden="true"><path d="M4 17 17 4l6 6-13 13H4z M13 8l6 6"/></svg></button></div><span>Materialien</span></div>
<div class="tool-group"><div><button id="pointLamp" title="Punktlicht hinzufügen" aria-label="Punktlicht hinzufügen"><svg viewBox="0 0 28 28" aria-hidden="true"><path d="M14 8a6 6 0 1 0 .01 0 M14 2v3m0 18v3M2 14h3m18 0h3M5 5l2 2m14 14 2 2M5 23l2-2m14-14 2-2"/></svg></button><button id="lamp" title="Flächenlicht hinzufügen" aria-label="Flächenlicht hinzufügen"><svg viewBox="0 0 28 28" aria-hidden="true"><path d="M4 5h16v9H4z M7 18l-2 5m7-5v6m5-6 2 5m4-16v7m-3-3h6"/></svg></button></div><span>Beleuchtung</span></div>
<div class="tool-group"><div><button id="camera" title="Kamera aus aktueller Ansicht hinzufügen" aria-label="Kamera aus aktueller Ansicht hinzufügen"><svg viewBox="0 0 28 28" aria-hidden="true"><path d="M2 8h15v13H2z M17 12l8-4v13l-8-4"/></svg></button><button id="fit" title="Baugruppe einpassen" aria-label="Baugruppe einpassen"><svg viewBox="0 0 28 28" aria-hidden="true"><path d="M3 10V3h7m8 0h7v7m0 8v7h-7m-8 0H3v-7"/></svg></button></div><span>Kameras</span></div>
<div class="tool-group"><div><button id="blenderSettings" title="Blender-Pfad" aria-label="Blender-Pfad"><svg viewBox="0 0 28 28" aria-hidden="true"><path d="M2 7h9l3 3h11l-3 12H3z M4 7V4h8l3 3h8v3"/></svg></button><button id="renderOptions" title="Rendereinstellungen" aria-label="Rendereinstellungen"><svg viewBox="0 0 28 28" aria-hidden="true"><path d="M3 7h9m6 0h7M3 20h3m7 0h12 M12 4h5v6h-5z M7 17h5v6H7z"/></svg></button><button id="render" title="Mit Cycles rendern" aria-label="Mit Cycles rendern"><svg viewBox="0 0 28 28" aria-hidden="true"><path d="M3 5h22v17H3z M11 9l7 5-7 4z"/></svg></button></div><span>Rendern</span></div>
</nav>
<main><aside><h2>Szenenbaum</h2><div id="tree"></div></aside>
<section id="stage"><div id="frame"><canvas id="view" aria-label="Interaktive Kameravorschau"></canvas><div id="empty">Baugruppe laden oder Szene öffnen.</div></div></section>
<aside><h2>Eigenschaften</h2><div id="props"></div></aside></main>
<footer><progress id="renderProgress" hidden aria-label="Renderfortschritt"></progress><span id="status" role="status">Bereit.</span></footer>
<dialog id="pathDialog" aria-labelledby="pathLabel"><form id="pathForm">
<label id="pathLabel" for="blenderPath">Pfad zur Blender-Programmdatei</label>
<input id="blenderPath" type="text" size="48" placeholder="Leer für automatische Suche"> <button id="browseBlender" type="button">Durchsuchen …</button>
<p id="pathError" role="alert" class="error"></p>
<button type="submit">Speichern</button> <button id="cancelPath" type="button">Abbrechen</button>
</form></dialog>
<dialog id="result"><div id="imageViewport" title="Mausrad zum Zoomen · Ziehen zum Verschieben"><img id="image" draggable="false" alt="Cycles-Rendering"></div><button id="imageFit">Einpassen</button> <button id="imageActual" title="Originalgröße">1:1</button><output id="imageScale"></output><a id="download" download="MetricCAD-Rendering.png">PNG speichern</a><button id="close">Schließen</button></dialog>
<script src="/editor.js"></script><script src="/visualizer_view.js"></script><script src="/visualizer.js"></script></body></html>
