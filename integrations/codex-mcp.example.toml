# In ~/.codex/config.toml den bisherigen MetricCAD-Eintrag ersetzen.
# app.py starten, dann im Part Studio auf „MCP starten“ klicken.
# Bei abweichendem Port die angezeigte MCP-Adresse übernehmen.
[mcp_servers.metriccad]
url = "http://127.0.0.1:8766/mcp"
startup_timeout_sec = 30
tool_timeout_sec = 180
